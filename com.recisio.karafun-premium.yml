id: com.recisio.karafun-premium
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: karafun
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
modules:
  - name: karafun
    buildsystem: simple
    build-commands:
      - cp -a main /app/main
      - install -Dm755 karafun.sh /app/bin/karafun
      - install -Dm644 main/resources/com.recisio.karafun-premium.desktop -t /app/share/applications
      - install -Dm644 main/resources/com.recisio.karafun-premium.metainfo.xml -t /app/share/metainfo
      - install -Dm644 main/resources/karafun-premium-128.png /app/share/icons/hicolor/128x128/apps/com.recisio.karafun-premium.png
      - install -Dm644 main/resources/karafun-premium-256.png /app/share/icons/hicolor/256x256/apps/com.recisio.karafun-premium.png
      - install -Dm644 main/resources/karafun-premium-512.png /app/share/icons/hicolor/512x512/apps/com.recisio.karafun-premium.png
    sources:
      - type: archive
        url: https://rec-eu.s3.amazonaws.com/KaraFun-linux-x64-3.14.0.157.zip
        sha256: 9fffcbf95e850cf042ba3efc2f9a3d1eb9a37526cab4bf1fc4fcaaa7ac1ef452
        dest: main
        only-arches: [x86_64]
      - type: script
        dest-filename: karafun.sh
        commands:
          - exec zypak-wrapper /app/main/KaraFun "$@"
